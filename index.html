<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPIc Style Mock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">OPIc Style Mock</div>
      <div id="progressLabel">Orientation</div>
    </header>

    <main class="container">
      <section id="introScreen" class="card active">
        <h1>OPIc 모의 테스트</h1>
        <p>Background Survey → Self Assessment → Setup → Questions 흐름으로 진행됩니다.</p>
        <button id="startBtn" class="btn primary">Start</button>
      </section>

      <section id="surveyScreen" class="card">
        <h2>Step 1. Background Survey</h2>
        <form id="surveyForm"></form>
        <button id="surveyNextBtn" class="btn primary" type="button">다음</button>
      </section>

      <section id="selfScreen" class="card">
        <h2>Step 2. Self Assessment</h2>
        <p class="muted">본인의 말하기 수준과 가장 가까운 단계 1개를 선택하세요.</p>
        <div id="selfForm" class="option-list"></div>
        <button id="selfNextBtn" class="btn primary" type="button">다음</button>
      </section>

      <section id="setupScreen" class="card">
        <h2>Step 3. Setup</h2>
        <p>마이크 체크 후 시작하세요 (브라우저 권한 허용 필요).</p>
        <button id="micBtn" class="btn">마이크 체크</button>
        <button id="examStartBtn" class="btn primary" type="button">시험 시작</button>
      </section>

      <section id="examScreen" class="card">
        <h2 id="questionTitle"></h2>
        <p id="questionCategory" class="muted"></p>
        <audio id="questionAudio" controls preload="auto"></audio>
        <p id="questionText" class="question-text"></p>
        <div class="timer-box one">
          <div class="timer-item">
            <span class="label">총 남은 답변 시간</span>
            <span id="totalTimer" class="time">00:00</span>
          </div>
        </div>
        <div class="actions">
          <button id="playBtn" class="btn">문제 재생</button>
          <button id="nextBtn" class="btn primary">다음 문제</button>
        </div>
      </section>

      <section id="resultScreen" class="card">
        <h2>완료</h2>
        <div id="summary"></div>
        <button id="restartBtn" class="btn primary">다시 시작</button>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
